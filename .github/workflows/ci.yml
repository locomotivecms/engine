name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:      # fired by upstream locomotive repos once their master is green
  schedule:
    - cron: '0 4 * * 1'   # weekly safety net in case a dispatch was missed

env:
  INTERNAL_GEMS: 'custom_fields locomotivecms_steam locomotivecms_common'  # locomotive gems this repo pulls from dahogenelst/* via git
  DEPENDENTS: ''        # repos whose CI must run after this master goes green

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      # system specs drive the runner's preinstalled Chrome against http://locomotive.local
      - run: echo "127.0.0.1 locomotive.local" | sudo tee -a /etc/hosts
      # the jest suite runs in the editor-bundle job
      - run: bundle exec rspec --exclude-pattern "spec/javascript/**/*_spec.rb"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots-${{ matrix.ruby }}
          path: spec/dummy/tmp/capybara
          if-no-files-found: ignore

  editor-bundle:
    # the React editor is shipped prebuilt (app/assets); it must match its source
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.CASCADE_TOKEN || github.token }}  # a PAT, so the push below triggers CI
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test  # jest suite of the editor
      - run: yarn build:dev
      - name: Rebuilt bundle is committed (Dependabot PRs get it pushed, everyone else must commit it)
        env:
          BUNDLE: app/assets/javascripts/locomotive/editor.js app/assets/stylesheets/locomotive/editor.css
        run: |
          git diff --quiet -- $BUNDLE && exit 0
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ github.actor }}" = 'dependabot[bot]' ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "chore: rebuild editor bundle" -- $BUNDLE
            git push origin HEAD:${{ github.head_ref }}
          else
            git diff --stat -- $BUNDLE
            echo "::error::editor.js / editor.css are out of date: run 'yarn build:dev' and commit them"
            exit 1
          fi

  notify-dependents:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: for r in $DEPENDENTS; do gh workflow run ci.yml -R dahogenelst/$r; done

  bump-internal-gems:
    concurrency: bump-internal-gems  # serialize runs that race on the same branch
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.repository_owner == 'dahogenelst'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.CASCADE_TOKEN }}  # a PAT, so the push and PR below trigger CI
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Open an auto-merging PR when an internal gem moved
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}
        run: |
          [ -n "$INTERNAL_GEMS" ] || exit 0  # an empty list would make bundler update everything
          bundle lock --update $INTERNAL_GEMS
          git diff --quiet Gemfile.lock && exit 0
          # one fixed branch: a later run force-pushes onto the open PR instead of opening a conflicting one
          branch=cascade/bump-internal-gems
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c $branch
          git commit -am "chore: bump internal gems ($INTERNAL_GEMS)"
          git push --force origin $branch
          gh pr view $branch --json state --jq .state | grep -q OPEN || gh pr create --fill --head $branch
          gh pr merge $branch --auto --squash --delete-branch

  dependabot-automerge:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.CASCADE_TOKEN }}  # a PAT, so the merge push triggers CI and the cascade
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
